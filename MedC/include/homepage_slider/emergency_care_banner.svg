<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">24/7 Emergency Care banner</title>
  <desc id="desc">Emergency care promotional banner with a round-the-clock care message and a medical response illustration.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#d8e2ef"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17355f"/>
      <stop offset="1" stop-color="#3d73b8"/>
    </linearGradient>
    <linearGradient id="panelFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#d7e4f3" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="rightGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7fc"/>
      <stop offset="1" stop-color="#c7d7eb"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0e2a4d" flood-opacity="0.18"/>
