  <text x="240" y="154" fill="#f8fbff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="74" font-weight="700">24/7 Emergency Care</text>
  <text x="240" y="236" fill="#f6d992" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Immediate Care, Any Time</text>

  <rect x="48" y="282" width="740" height="534" rx="34" fill="url(#panelFade)"/>
  <text x="84" y="428" fill="#173b6d" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Immediate medical care available</text>
  <text x="84" y="494" fill="#173b6d" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">round the clock with expert doctors</text>
  <text x="84" y="560" fill="#173b6d" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">and advanced emergency facilities.</text>
  <line x1="84" y1="602" x2="640" y2="602" stroke="#a9bacd" stroke-width="3"/>
  <text x="84" y="674" fill="#1c3458" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Fast response. Expert triage. Emergency-ready support.</text>
  <text x="84" y="732" fill="#1c3458" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Designed to help patients feel safe from arrival onward.</text>

