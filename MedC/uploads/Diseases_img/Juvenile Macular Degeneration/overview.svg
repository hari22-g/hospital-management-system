<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Juvenile Macular Degeneration infographic</title>
  <desc id="desc">Illustration showing central vision problems affecting the macula.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3fbff"/>
      <stop offset="100%" stop-color="#dcefff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="580" rx="38" fill="#ffffff" opacity="0.95"/>
  <text x="130" y="155" fill="#256ba5" font-family="Arial, sans-serif" font-size="48" font-weight="700">Juvenile Macular Degeneration</text>
  <text x="130" y="215" fill="#668daf" font-family="Arial, sans-serif" font-size="28">Inherited eye condition affecting detailed central vision</text>
  <g transform="translate(720 120)">
    <ellipse cx="150" cy="150" rx="160" ry="104" fill="#eef8ff" stroke="#d4e8fa" stroke-width="8"/>
    <circle cx="150" cy="150" r="62" fill="#5da2f0"/>
    <circle cx="150" cy="150" r="28" fill="#203649"/>
    <circle cx="150" cy="150" r="12" fill="#ffffff"/>
    <circle cx="150" cy="150" r="96" fill="none" stroke="#8cc3ff" stroke-width="10" stroke-dasharray="10 18"/>
  </g>
  <g transform="translate(150 332)">
    <text x="0" y="0" fill="#256ba5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Typical signs</text>
    <text x="0" y="58" fill="#668daf" font-family="Arial, sans-serif" font-size="24">• Blurred or distorted central vision</text>
    <text x="0" y="100" fill="#668daf" font-family="Arial, sans-serif" font-size="24">• Trouble reading, recognizing faces, or seeing details</text>
    <text x="0" y="142" fill="#668daf" font-family="Arial, sans-serif" font-size="24">• Light sensitivity or slow adjustment to dim light</text>
  </g>
</svg>
