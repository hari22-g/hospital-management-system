<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Jaundice infographic</title>
  <desc id="desc">Illustration showing yellowing of the eyes and liver-related symptoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9df"/>
      <stop offset="100%" stop-color="#ffe48f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="580" rx="38" fill="#ffffff" opacity="0.95"/>
  <text x="130" y="165" fill="#9b6a00" font-family="Arial, sans-serif" font-size="54" font-weight="700">Jaundice</text>
  <text x="130" y="225" fill="#af8743" font-family="Arial, sans-serif" font-size="28">Yellowing of skin and eyes linked to bilirubin buildup</text>
  <g transform="translate(740 128)">
    <circle cx="130" cy="138" r="110" fill="#fff7d3"/>
    <circle cx="98" cy="124" r="16" fill="#3a3a3a"/>
    <circle cx="162" cy="124" r="16" fill="#3a3a3a"/>
    <circle cx="98" cy="124" r="8" fill="#ffd45c"/>
    <circle cx="162" cy="124" r="8" fill="#ffd45c"/>
    <path d="M94 186 q36 22 72 0" fill="none" stroke="#ce9a2b" stroke-width="10" stroke-linecap="round"/>
    <path d="M64 262 c0 -70 48 -110 104 -110 s104 40 104 110" fill="#ffd970" opacity="0.88"/>
  </g>
  <g transform="translate(150 330)">
    <text x="0" y="0" fill="#9b6a00" font-family="Arial, sans-serif" font-size="30" font-weight="700">What to notice</text>
    <text x="0" y="58" fill="#9b7d46" font-family="Arial, sans-serif" font-size="24">• Yellow eyes and yellowish skin</text>
    <text x="0" y="100" fill="#9b7d46" font-family="Arial, sans-serif" font-size="24">• Dark urine and pale stool</text>
    <text x="0" y="142" fill="#9b7d46" font-family="Arial, sans-serif" font-size="24">• Tiredness, itching, or abdominal discomfort</text>
  </g>
</svg>
