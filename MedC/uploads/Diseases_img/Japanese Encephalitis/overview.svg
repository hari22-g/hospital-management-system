<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Japanese Encephalitis infographic</title>
  <desc id="desc">Illustration showing mosquito-borne brain infection and warning signs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f7ff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="580" rx="38" fill="#ffffff" opacity="0.95"/>
  <text x="130" y="155" fill="#244e95" font-family="Arial, sans-serif" font-size="50" font-weight="700">Japanese Encephalitis</text>
  <text x="130" y="215" fill="#6280b3" font-family="Arial, sans-serif" font-size="28">Mosquito-borne viral infection affecting the brain</text>
  <g transform="translate(720 120)">
    <circle cx="124" cy="150" r="104" fill="#eef4ff"/>
    <path d="M96 84 c-40 22 -62 58 -62 102 0 68 50 126 116 150 66 -24 116 -82 116 -150 0 -44 -22 -80 -62 -102z" fill="#87b2ff"/>
    <path d="M150 112 q-24 14 -24 42 0 18 10 34" fill="none" stroke="#2457b5" stroke-width="14" stroke-linecap="round"/>
    <path d="M370 82 h52 M362 120 l44 22 M362 44 l44 -22" fill="none" stroke="#4e77bd" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="324" cy="82" rx="32" ry="16" fill="#41576d"/>
    <line x1="292" y1="82" x2="248" y2="82" stroke="#41576d" stroke-width="6"/>
  </g>
  <g transform="translate(150 332)">
    <text x="0" y="0" fill="#244e95" font-family="Arial, sans-serif" font-size="30" font-weight="700">Common symptoms</text>
    <text x="0" y="58" fill="#5d78aa" font-family="Arial, sans-serif" font-size="24">• High fever, headache, and vomiting</text>
    <text x="0" y="100" fill="#5d78aa" font-family="Arial, sans-serif" font-size="24">• Confusion, seizures, or neck stiffness</text>
    <text x="0" y="142" fill="#5d78aa" font-family="Arial, sans-serif" font-size="24">• Weakness or reduced consciousness in severe cases</text>
  </g>
</svg>
