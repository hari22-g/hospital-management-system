<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Indigestion infographic</title>
  <desc id="desc">Illustration showing stomach discomfort and common indigestion symptoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ef"/>
      <stop offset="100%" stop-color="#ffe3c6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="580" rx="38" fill="#ffffff" opacity="0.95"/>
  <text x="130" y="165" fill="#8f4f12" font-family="Arial, sans-serif" font-size="54" font-weight="700">Indigestion</text>
  <text x="130" y="225" fill="#a7703c" font-family="Arial, sans-serif" font-size="28">Digestive discomfort after meals</text>
  <g transform="translate(720 150)">
    <path d="M154 52 c-58 0 -102 46 -102 105 0 75 57 141 130 175 73 -34 118 -100 118 -168 0 -62 -46 -112 -108 -112 -20 0 -34 4 -38 7z" fill="#ffb066" opacity="0.85"/>
    <path d="M154 98 c-22 18 -35 49 -35 81 0 30 12 64 31 89" fill="none" stroke="#dd6f2f" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g transform="translate(150 318)">
    <text x="0" y="0" fill="#8f4f12" font-family="Arial, sans-serif" font-size="30" font-weight="700">Common symptoms</text>
    <text x="0" y="58" fill="#8c633f" font-family="Arial, sans-serif" font-size="24">• Bloating and heaviness after eating</text>
    <text x="0" y="100" fill="#8c633f" font-family="Arial, sans-serif" font-size="24">• Burning or pain in the upper abdomen</text>
    <text x="0" y="142" fill="#8c633f" font-family="Arial, sans-serif" font-size="24">• Early fullness, nausea, or burping</text>
    <rect x="0" y="190" width="420" height="108" rx="24" fill="#fff3e8" stroke="#ffd2a9" stroke-width="4"/>
    <text x="28" y="236" fill="#8f4f12" font-family="Arial, sans-serif" font-size="24" font-weight="700">Helpful tips</text>
    <text x="28" y="274" fill="#8c633f" font-family="Arial, sans-serif" font-size="22">Eat smaller meals and avoid spicy, greasy food.</text>
  </g>
</svg>
