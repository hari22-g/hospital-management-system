<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Jackhammer Esophagus infographic</title>
  <desc id="desc">Illustration showing spasm-like contractions in the swallowing tube.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4f0"/>
      <stop offset="100%" stop-color="#ffd9cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="580" rx="38" fill="#ffffff" opacity="0.95"/>
  <text x="130" y="160" fill="#a45138" font-family="Arial, sans-serif" font-size="50" font-weight="700">Jackhammer Esophagus</text>
  <text x="130" y="220" fill="#ba7a67" font-family="Arial, sans-serif" font-size="28">A swallowing disorder with very strong esophageal contractions</text>
  <g transform="translate(760 120)">
    <rect x="82" y="36" width="72" height="230" rx="36" fill="#ffb4a1"/>
    <circle cx="118" cy="290" r="44" fill="#ffc9b9"/>
    <path d="M118 76 v146" stroke="#9f4d34" stroke-width="16" stroke-linecap="round" stroke-dasharray="26 18"/>
    <path d="M214 88 h52 M198 118 l44 20 M198 58 l44 -20" fill="none" stroke="#ba7a67" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="164" cy="88" rx="32" ry="16" fill="#7d6b61"/>
  </g>
  <g transform="translate(150 336)">
    <text x="0" y="0" fill="#a45138" font-family="Arial, sans-serif" font-size="30" font-weight="700">Possible symptoms</text>
    <text x="0" y="58" fill="#a97c6b" font-family="Arial, sans-serif" font-size="24">• Chest pain after swallowing</text>
    <text x="0" y="100" fill="#a97c6b" font-family="Arial, sans-serif" font-size="24">• Feeling that food sticks in the throat or chest</text>
    <text x="0" y="142" fill="#a97c6b" font-family="Arial, sans-serif" font-size="24">• Painful swallowing or food coming back up</text>
  </g>
</svg>
